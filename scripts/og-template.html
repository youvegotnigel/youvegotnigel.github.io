<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap"
    rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; background: #0A0A0B;
      font-family: 'JetBrains Mono', monospace; color: #F2F2EE;
      display: flex; flex-direction: column; justify-content: center;
      padding: 80px; position: relative; overflow: hidden;
    }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(#1C1C20 1px, transparent 1px),
        linear-gradient(90deg, #1C1C20 1px, transparent 1px);
      background-size: 48px 48px; opacity: .35;
    }
    .glow {
      position: absolute; width: 700px; height: 700px; right: -200px; top: -250px;
      background: radial-gradient(circle, rgba(212,255,63,.14), transparent 60%);
    }
    .prompt { font-size: 20px; color: #D4FF3F; margin-bottom: 28px; position: relative; }
    .prompt span { color: #9A9A93; }
    h1 {
      font-family: 'Fraunces', serif; font-weight: 400; font-size: 64px;
      line-height: 1.15; position: relative; margin-bottom: 32px;
    }
    h1 em { font-style: italic; color: #D4FF3F; }
    .meta { display: flex; gap: 14px; position: relative; flex-wrap: wrap; }
    .chip {
      font-size: 17px; padding: 8px 18px; border: 1px solid #26262C;
      color: #9A9A93; border-radius: 2px;
    }
    .name-row {
      position: absolute; bottom: 56px; left: 80px; right: 80px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 20px; color: #9A9A93;
    }
    .name-row .name { color: #F2F2EE; font-weight: 500; letter-spacing: .06em; }
    .name-row .dot { color: #D4FF3F; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="prompt">$ <span>whoami --role</span></div>
  <h1>I build frameworks.<br>You ship <em>without fear.</em></h1>
  <div class="meta">
    <span class="chip">Playwright</span>
    <span class="chip">Selenide</span>
    <span class="chip">K6</span>
    <span class="chip">REST Assured</span>
    <span class="chip">AWS</span>
  </div>
  <div class="name-row">
    <span class="name">NIGEL MULHOLLAND <span class="dot">/</span> Lead Test Automation Engineer</span>
    <span>youvegotnigel.github.io</span>
  </div>
</body>
</html>
